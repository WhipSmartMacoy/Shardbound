#frame{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;background:#000;box-shadow:0 0 0 2px #2a2440,0 10px 40px #000}
#cv{position:absolute;left:0;top:0;width:960px;height:540px;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:absolute;inset:0;font-family:'VT323',monospace;font-size:25px;color:#fff;user-select:none;-webkit-user-select:none}

.win h3{margin:2px 0 6px;font-family:'Press Start 2P',monospace;font-size:12px;color:#ffe680;font-weight:normal}
.opt{display:flex;align-items:center;gap:4px;cursor:pointer;padding:1px 0;white-space:nowrap}
.opt .cur{width:20px;flex:none}
.opt .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
.opt .rt{color:#cfd6ff;margin-left:10px}
.opt.sel .lbl{color:#fff8b0}
.opt.dis,.opt.dis .rt{color:#7c84b8}
.arrow{text-align:center;height:14px;font-size:16px;line-height:14px;color:#cfd6ff}
.msg{cursor:pointer}
.more{position:absolute;right:12px;bottom:4px;animation:bl .8s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.y{color:#ffe680}.g{color:#7dffa0}.b{color:#8ec5ff}.r{color:#ff8a8a}.dim{color:#9aa3d8}.p{color:#e0a8ff}
.btn{display:inline-block;margin:6px 8px 0 0;padding:1px 10px;border:2px solid #eef0ff;border-radius:5px;background:#0d1350;cursor:pointer}
.btn:hover{background:#2d3ca8}
.title{position:absolute;left:0;right:0;top:80px;text-align:center;font-family:'Press Start 2P',monospace;font-size:50px;color:#ffe680;text-shadow:4px 4px 0 #7a2a00,8px 8px 0 #000}
.subt{position:absolute;left:0;right:0;top:160px;text-align:center;font-size:28px;color:#cfd6ff;text-shadow:2px 2px 0 #000}
.ban{font-family:'Press Start 2P',monospace;font-size:13px;color:#ffe680;margin-bottom:8px}
small{font-size:21px;color:#c8cff8}
.prow{display:grid;grid-template-columns:86px 62px 1fr 64px;align-items:center;height:27px}
.prow.act .pn{color:#ffe680}
.hpb{height:5px;background:#0008;border:1px solid #000;margin-top:1px;width:110px}
.hpb i{display:block;height:100%;background:#5fe07a}
.card{position:absolute;left:0;right:0;top:200px;text-align:center}
.card .a{font-family:'Press Start 2P',monospace;font-size:34px;color:#ffe680;text-shadow:4px 4px 0 #000}
.card .b2{font-size:34px;color:#cfd6ff;margin-top:14px}
img.px{image-rendering:pixelated;vertical-align:middle}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px;margin:4px 0}
#pad{display:none}#pad.on{display:block}
.cl{position:fixed;display:grid;gap:6px;z-index:5}
.pb{width:58px;height:58px;border-radius:12px;border:2px solid #cfd6ff;background:rgba(30,40,120,.55);color:#fff;font:20px 'Press Start 2P',monospace;display:flex;align-items:center;justify-content:center;touch-action:none}
.pb:active,.pb.dn{background:rgba(90,110,230,.85)}

#ab{grid-template-columns:62px 62px;right:max(12px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom))}
#ab .pb{width:62px;height:62px;border-radius:50%}
#pad.land .pb{width:48px;height:48px;font-size:16px}#pad.land #dp{grid-template-columns:48px 48px 48px}#pad.land #ab{grid-template-columns:52px 52px}#pad.land #ab .pb{width:52px;height:52px}

const oids=new WeakMap();let oidN=0;const oid=o=>{if(!oids.has(o))oids.set(o,++oidN);return oids.get(o)};

function grey(c){const n=parseInt(c.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,v=Math.round((r*.3+g*.59+b*.11)*.6);return `rgb(${v},${v},${v+10})`}
function sprite(rows,pal,mode=0){const k=oid(rows)+'|'+oid(pal)+'|'+mode;let c=sprCache.get(k);if(c)return c;
 c=document.createElement('canvas');c.width=16;c.height=rows.length;const x=c.getContext('2d');
 rows.forEach((row,y)=>{for(let i=0;i<16;i++){const col=pal[row[i]];if(!col)continue;x.fillStyle=mode===1?'#fff':mode===2?'#0b0a12':mode===3?grey(col):col;x.fillRect(i,y,1,1)}});
 sprCache.set(k,c);return c}
function drawSpr(c,x,y,s,flip=false,alpha=1){ctx.save();ctx.globalAlpha=alpha;if(flip){ctx.translate(Math.round(x+16*s),Math.round(y));ctx.scale(-1,1);ctx.drawImage(c,0,0,16*s,c.height*s)}else ctx.drawImage(c,Math.round(x),Math.round(y),16*s,c.height*s);ctx.restore()}

// ================= stats =================
function stats(h){const g=CHARS[h.id].g,L=h.lv;
 let hp=g.hp*(30+11*L),mp=g.mp*(8+2.5*L),str=g.str*(6+1.7*L),mag=g.mag*(6+1.7*L),def=g.def*(3+1.3*L),agi=g.agi*(6+.8*L);
 hp*=1+.08*up('vit');mp*=1+.1*up('wis');
 if(has('vitalseed'))hp*=1.2;if(has('glassblade'))hp*=.75;if(has('manaprism'))mp*=1.3;if(has('swiftfeather'))agi+=6;
 if(has('crown')){hp*=1.15;mp*=1.15;str*=1.15;mag*=1.15;def*=1.15;agi*=1.15}
 if(run)hp*=run.hpMult;
 const s={hp:Math.max(1,Math.round(hp)),mp:Math.round(mp),str:Math.round(str),mag:Math.round(mag),def:Math.round(def),agi:Math.round(agi)};
 s.mdef=Math.round(s.def*.5+s.mag*.5);return s}
const xpNeed=lv=>Math.round(6*Math.pow(lv,1.6));
function makeHero(id,lv){const h={id,lv,xp:0,hp:1,mp:0};const s=stats(h);h.hp=s.hp;h.mp=s.mp;return h}
function withMax(fn){const before=run.party.map(h=>stats(h));fn();run.party.forEach((h,i)=>{const a=stats(h),b=before[i];if(h.hp>0)h.hp=clamp(h.hp+Math.max(0,a.hp-b.hp),1,a.hp);h.mp=clamp(h.mp+Math.max(0,a.mp-b.mp),0,a.mp)})}
function outMult(h,kind){let m=1+.06*up('might');if(kind==='phys'&&has('whetstone'))m*=1.2;if(has('glassblade'))m*=1.45;if(kind==='magic'&&has('embercore'))m*=1.3;
 if(has('berserker')&&h.hp<stats(h).hp*.5)m*=1.4;if(h.id==='kael'&&kind==='phys')m*=1+.1*up('sig_kael');if(h.id==='doran'&&kind==='magic')m*=1+.15*up('sig_doran');return m}
function critChance(h){let c=.05;if(h.id==='pip')c+=.1;if(has('clover'))c+=.1;if(has('loadeddice'))c+=.05;return c}
function skillCost(h,id){let c=SK[id].mp;if(has('battery'))c=Math.floor(c*.7);if(h.id==='mira'&&up('sig_mira'))c=Math.max(0,c-1);return c}
function goldMult(){return (1+.25*up('coin'))*(has('goldtooth')?1.5:1)*(run.party.some(h=>h.id==='pip')?1+.3*up('sig_pip'):1)}
function price(p){return Math.round(p*(up('favor')?.8:1))}
function poolOpen(p){if(p==='base')return true;if(p.startsWith('ach:'))return !!meta.ach[p.slice(4)];return !!meta.unlocked[p]}
function relicPool(){return Object.keys(RELICS).filter(id=>poolOpen(RELICS[id].pool)&&!(run&&run.relics.includes(id)))}
function gainRelic(id){withMax(()=>run.relics.push(id));meta.seen[id]=true;save()}

function choose(o){return new Promise(res=>{const m=Object.assign({kind:'menu',x:12,y:356,w:312,rows:8,cancel:true},o);m.resolve=res;
 if(o.idx==null){const i=m.items.findIndex(it=>!it.disabled);m.idx=i<0?0:i}m.idx=clamp(m.idx,0,m.items.length-1);menus.push(m);hovered(m);render()})}
function say(html,o={}){return new Promise(res=>{menus.push(Object.assign({kind:'msg',html,x:120,y:150,w:720,resolve:res},o));render()})}
async function confirmBox(q,o={}){return (await choose(Object.assign({head:q,x:280,y:170,w:400,items:[{label:'Yes',value:'y'},{label:'No',value:'n'}],idx:0},o)))==='y'}
function closeMenu(m,val){const i=menus.indexOf(m);if(i>=0)menus.splice(i,1);infoHTML=null;if(B)B.cursor=null;render();m.resolve(val)}
function hovered(m){if(m.onHover&&m.items[m.idx])m.onHover(m.items[m.idx])}
function setInfo(html,style){infoHTML=html;infoStyle=style}
function menuKey(k){const m=menus[menus.length-1];
 if(m.kind==='msg'){if(k==='a'||k==='b'){SFX.ok();closeMenu(m)}return}
 const n=m.items.length;let i=m.idx;
 if(k==='up')i=(i-1+n)%n;if(k==='down')i=(i+1)%n;
 if(i!==m.idx){m.idx=i;SFX.move();hovered(m);render();return}
 if(k==='a'){const it=m.items[m.idx];if(!it||it.disabled){SFX.err();return}SFX.ok();closeMenu(m,it.value!==undefined?it.value:m.idx)}
 if(k==='b'&&m.cancel){SFX.back();closeMenu(m,null)}}
function menuHTML(m,mi,active){
 const st=`left:${m.x}px;top:${m.y}px;width:${m.w}px;`;
 if(m.kind==='msg')return `<div class="win msg" data-msg="1" style="${st}">${m.html}${active?'<span class="more">▼</span>':''}</div>`;
 const n=m.items.length,rows=Math.min(m.rows,n);let start=0;if(n>rows)start=clamp(m.idx-Math.floor(rows/2),0,n-rows);
 let h=`<div class="win" style="${st}">`;if(m.title)h+=`<h3>${m.title}</h3>`;if(m.head)h+=`<div style="margin-bottom:6px">${m.head}</div>`;
 if(n>rows)h+=`<div class="arrow">${start>0?'▲':''}</div>`;
 for(let i=start;i<start+rows;i++){const it=m.items[i],sel=i===m.idx;
  h+=`<div class="opt${sel?' sel':''}${it.disabled?' dis':''}" data-m="${mi}" data-i="${i}"><span class="cur">${sel&&active?'▶':''}</span><span class="lbl">${it.label}</span>${it.right!=null?`<span class="rt">${it.right}</span>`:''}</div>`}
 if(n>rows)h+=`<div class="arrow">${start+rows<n?'▼':''}</div>`;return h+'</div>'}
function render(){let h=panelsHTML();if(infoHTML)h+=`<div class="win" style="${infoStyle}">${infoHTML}</div>`;menus.forEach((m,i)=>h+=menuHTML(m,i,i===menus.length-1));ui.innerHTML=h}

const KEYS={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',Enter:'a',z:'a',Z:'a',' ':'a',Escape:'b',x:'b',X:'b',Backspace:'b'};
addEventListener('keydown',e=>{audio();if(e.key==='m'||e.key==='M'){muted=!muted;return}const k=KEYS[e.key];if(!k)return;e.preventDefault();if(e.repeat&&(k==='a'||k==='b'))return;handleKey(k)});
function handleKey(k){
 if(menus.length)return menuKey(k);
 if(mode==='dungeon'&&!busy&&run){if(k==='up')tryMove(0,-1);else if(k==='down')tryMove(0,1);else if(k==='left')tryMove(-1,0);else if(k==='right')tryMove(1,0);else if(k==='a')doRoomAction();else if(k==='b')pauseMenu()}}
padEl.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-pad]');if(!b)return;e.preventDefault();audio();b.classList.add('dn');setTimeout(()=>b.classList.remove('dn'),120);handleKey(b.dataset.pad)});
padEl.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
function canvasXY(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*480,(e.clientY-r.top)/r.height*270]}
ui.addEventListener('pointerup',e=>{if(e.button>0)return;audio();const top=menus[menus.length-1];
 if(e.target.closest('[data-msg]')&&top&&top.kind==='msg'){SFX.ok();closeMenu(top);return}
 const o=e.target.closest('[data-i]');if(o){if(menus[+o.dataset.m]!==top)return;top.idx=+o.dataset.i;menuKey('a');return}
 const b=e.target.closest('[data-act]');if(b){if(!menus.length&&!busy&&ACT[b.dataset.act])ACT[b.dataset.act]();return}
 if(e.target.closest('.win'))return;
 const [x,y]=canvasXY(e);
 if(top&&top.kind==='menu'&&mode==='battle'){const i=top.items.findIndex(it=>it.unit&&it.unit.x!=null&&Math.abs(it.unit.x-x)<8*it.unit.scale&&y<it.unit.y&&y>it.unit.y-16*it.unit.scale);if(i>=0){top.idx=i;menuKey('a')}return}
 if(!menus.length&&mode==='dungeon'&&!busy&&run){if(y<30&&Math.abs(x-240)<30)tryMove(0,-1);else if(y>170&&y<200&&Math.abs(x-240)<30)tryMove(0,1);else if(x<30&&Math.abs(y-100)<30)tryMove(-1,0);else if(x>450&&Math.abs(y-100)<30)tryMove(1,0)}});
ui.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const o=e.target.closest('[data-i]');if(!o)return;const top=menus[menus.length-1];if(menus[+o.dataset.m]!==top)return;const i=+o.dataset.i;if(top.idx!==i){top.idx=i;hovered(top);render()}});
const ACT={room:()=>doRoomAction(),menu:()=>pauseMenu()};

function partyHTML(){if(!run)return '';return run.party.map(h=>{const s=stats(h),dead=h.hp<=0,act=B&&B.acting===h;
 return `<div class="prow${act?' act':''}"><span class="pn ${dead?'r':''}">${nm(h)}</span><span class="dim">Lv${h.lv}</span><span><span class="${dead||h.hp<s.hp*.25?'r':''}">${h.hp}/${s.hp}</span><div class="hpb"><i style="width:${Math.min(100,100*h.hp/s.hp)}%;background:${h.hp<s.hp*.25?'#ff6a6a':'#5fe07a'}"></i></div></span><span class="b">${h.mp}<span class="dim">mp</span></span></div>`}).join('')}
function panelsHTML(){let h='';
 if(mode==='title'){h+=`<div class="title">SHARDBOUND</div><div class="subt">a turn-based roguelite · gameplay demo</div><div class="demo">Arrows/WASD · Z/Enter = confirm · X/Esc = back · M = mute</div>`}
 else if(mode==='camp'){const rs=roster().length;h+=`<div class="win" style="left:12px;top:12px;width:300px"><h3>Camp</h3>Soul Shards <span class="y">✦ ${meta.shards}</span><br>Heroes ${rs}/4 · Camp Tier ${['I','II','III','IV'][rs-1]}</div>
  <div class="win" style="left:600px;top:12px;width:348px"><h3>Record</h3>Runs ${meta.st.runs} · Wins ${meta.st.wins}<br>Best floor ${meta.st.best} · Kills ${meta.st.kills}</div>`}
 else if(mode==='dungeon'&&run){const r=curRoom();
  if(card){return `<div class="card"><div class="a">${card.a}</div><div class="b2">${card.b}</div></div>`}
  h+=`<div class="win" style="left:12px;top:12px;width:400px"><span class="y">F${run.floor+1}</span> ${FLOORS[run.floor].name}<br>Gold <span class="y">${run.gold}</span> · Keys <span class="y">${run.keys}</span> · Relics <span class="p">${run.relics.length}</span></div>`;
  if(r){const R=ROOMS[r.type],a=roomActionDef(r);let txt=R.text;
   if(r.type==='cell'&&!r.used&&!meta.unlocked.doran)txt='A young mage slumps in an iron cage. He looks up hopefully.';
   if(r.type==='shop'&&!meta.unlocked.pip)txt='A merchant\'s stall. A scruffy kid in a green hood is being held here over a debt.';
   if(r.used&&['chest','camp','altar','fountain','treasure'].includes(r.type))txt='There is nothing more here.';
   if(r.type==='boss'&&run.floor===2)txt='Silence. The Shard is free.';
   h+=`<div class="win" style="left:12px;top:404px;width:560px;height:128px"><h3>${R.name}</h3>${txt}<div>${a?`<span class="btn" data-act="room">Z · ${a.label}</span>`:''}<span class="btn" data-act="menu">X · Menu</span><span class="dim" style="font-size:19px"> D-pad / tap doors</span></div></div>`}
  h+=`<div class="win" style="left:584px;top:404px;width:364px;height:128px;padding-top:4px">${partyHTML()}</div>`}
 else if(mode==='battle'&&B){
  if(B.msg)h+=`<div class="win" style="left:230px;top:10px;width:500px;text-align:center">${B.msg}</div>`;
  const groups={};B.enemies.filter(e=>!e.dead).forEach(e=>groups[e.name]=(groups[e.name]||0)+1);
  h+=`<div class="win" style="left:12px;top:404px;width:312px;height:128px">${Object.entries(groups).map(([n,c])=>`${n}${c>1?' <span class="dim">×'+c+'</span>':''}`).join('<br>')}</div>`;
  h+=`<div class="win" style="left:336px;top:404px;width:612px;height:128px;padding-top:4px">${partyHTML()}</div>`}
 else if(mode==='end'){}
 return h}

function fade(to,ms=250){return new Promise(res=>{const from=fadeA,t0=now();(function st(){const k=Math.min(1,(now()-t0)/ms);fadeA=from+(to-from)*k;if(k<1)requestAnimationFrame(st);else res()})()})}
const stars=Array.from({length:90},()=>[rnd()*480,rnd()*200,rnd()*6]);

function genFloor(fi){const N=9,target=9+fi*2,specials=['boss','treasure','shop'].concat(fi===1?['cell']:[]);const K=(x,y)=>x+','+y;const D4=[[1,0],[-1,0],[0,1],[0,-1]];
 for(let tries=0;tries<3000;tries++){const R={};R[K(4,4)]={x:4,y:4};const list=[[4,4]],q=[[4,4]];const nb=(x,y)=>D4.filter(([dx,dy])=>R[K(x+dx,y+dy)]).length;let guard=0;
  while(list.length<target&&guard++<400){if(!q.length)q.push(pick(list));const [cx,cy]=q.shift();
   for(const [dx,dy] of shuffle(D4.slice())){if(list.length>=target)break;const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=N||ny>=N||R[K(nx,ny)]||rnd()<.5||nb(nx,ny)>1)continue;R[K(nx,ny)]={x:nx,y:ny};list.push([nx,ny]);q.push([nx,ny])}}
  if(list.length<target)continue;
  const dist={[K(4,4)]:0},bq=[[4,4]];while(bq.length){const [x,y]=bq.shift();for(const [dx,dy] of D4){const k=K(x+dx,y+dy);if(R[k]&&dist[k]==null){dist[k]=dist[K(x,y)]+1;bq.push([x+dx,y+dy])}}}
  const dead=list.filter(([x,y])=>!(x===4&&y===4)&&nb(x,y)===1).sort((a,b)=>dist[K(...b)]-dist[K(...a)]);
  if(dead.length<specials.length||dist[K(...dead[0])]<3)continue;
  for(const k in R)R[k].type='combat';R[K(4,4)].type='start';R[K(...dead[0])].type='boss';
  const rest=shuffle(dead.slice(1));specials.slice(1).forEach((s,i)=>R[K(...rest[i])].type=s);
  const others=shuffle(list.filter(([x,y])=>R[K(x,y)].type==='combat'));
  const extra=fi===0?['chest',pick(['fountain','altar'])]:['camp','chest',pick(['fountain','altar'])];
  extra.forEach((s,i)=>{if(others[i])R[K(...others[i])].type=s});
  for(const k in R){const r=R[k];r.cleared=!(r.type==='combat'||r.type==='boss')}
  return {R}}
 throw new Error('floor gen failed')}
function reveal(x,y){const r=room(x,y);r.visited=true;r.seen=true;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const n=room(x+dx,y+dy);if(n)n.seen=true}}

 if(meta.st.runs===1){fadeA=1;mode='end';render();await say(`The Shard that lit the world has shattered, and its last piece sinks into the Under-Spire.<br><br><span class="y">Kael</span> descends alone. He won't stay alone for long...`)}

 if(has('compass'))Object.values(run.map.R).forEach(r=>r.seen=true);reveal(4,4);render();await fade(0,300);

 try{if(r.type==='cell'&&!r.open){if(run.keys>0){if(!(await confirmBox('A sealed iron door. Use a <span class="y">Key</span>?')))return;run.keys--;r.open=true;SFX.unlock()}else{await say('A sealed iron door. It needs a <span class="y">Key</span>. Keys drop from battles, chests and shops.');return}}

async function onEnter(r){

const SLOTS={1:[[150,160]],2:[[105,130],[195,165]],3:[[85,115],[195,120],[140,178]],4:[[80,110],[185,110],[105,180],[210,180]]};
function makeEnemy(k,n){const d=EN[k],hpM=d.boss?(.55+.45*n):(.85+.15*n);const e=Object.assign({key:k,scale:2,acts:[['atk',1]]},d);e.acts=e.acts.slice();e.maxhp=Math.round(d.hp*hpM);e.hp=e.maxhp;e.atk=d.atk*(d.boss?1+.04*(n-1):1);e.dead=false;e.poison=0;e.stolen=false;return e}
function heroXY(h){const n=run.party.length,i=run.party.indexOf(h),st=125-(n-1)*17;return [392+i*10-(B&&B.step===h?18:0),st+i*34]}

async function battle(keys,opt={}){busy=true;SFX.enc();
 for(let i=0;i<3;i++){fadeA=.8;await sleep(60);fadeA=0;await sleep(60)}await fade(1,180);
 const n=run.party.length,enemies=keys.map(k=>makeEnemy(k,n));const cnt={};enemies.forEach(e=>{cnt[e.name]=(cnt[e.name]||0)+1});const seen={};
 enemies.forEach(e=>{if(cnt[e.name]>1){seen[e.name]=(seen[e.name]||0)+1;e.label=e.name+' '+'ABCD'[seen[e.name]-1]}else e.label=e.name});
 if(enemies.length===1&&enemies[0].boss){enemies[0].x=150;enemies[0].y=196}else enemies.forEach((e,i)=>{[e.x,e.y]=SLOTS[enemies.length][i]});
 B={enemies,fx:[],round:0,boss:!!opt.boss,cursor:null,acting:null,step:null,msg:'',def:new Set(),hurt:new Map()};mode='battle';render();await fade(0,220);
 let result=null;
 while(true){B.round++;
  if(B.round>1){if(has('etherleaf'))run.party.forEach(h=>{if(h.hp>0)h.mp=Math.min(stats(h).mp,h.mp+2)});
   if(has('halo'))run.party.forEach(h=>{if(h.hp>0){const a=Math.round(stats(h).hp*.05);h.hp=Math.min(stats(h).hp,h.hp+a)}});render()}
  const cmds=await inputPhase();let order;
  if(cmds==='flee'){const ok=has('smokebomb')||rnd()<.55+(run.party.some(h=>h.id==='pip'&&h.hp>0)?.2:0);B.msg=ok?'Escaped!':"Couldn't escape!";render();await sleep(700);B.msg='';if(ok){result='fled';break}
   order=B.enemies.filter(e=>!e.dead).map(e=>({u:e}))}

   B.enemies.filter(e=>!e.dead).forEach(e=>order.push({u:e,i:e.agi*(.75+rnd()*.5)}));order.sort((a,b)=>b.i-a.i)}
  for(const o of order){if(checkEnd())break;if(o.hero?o.u.hp<=0:o.u.dead)continue;if(o.hero)await heroAct(o.u,o.c);else await enemyAct(o.u)}
  B.def.clear();result=checkEnd();if(result)break;

  result=checkEnd();if(result)break}
 if(result==='win'){await sleep(500);await victory()}
 if(result==='lose'){SFX.die();await sleep(500);await say('Your party has fallen...')}

 return result}
function checkEnd(){if(B.enemies.every(e=>e.dead))return 'win';if(run.party.every(h=>h.hp<=0))return 'lose';return null}
async function inputPhase(){const alive=run.party.filter(h=>h.hp>0);const cmds=new Map();let i=0;
 while(i<alive.length){const h=alive[i];B.acting=h;B.step=h;render();const c=await commandMenu(h,i>0);B.step=null;
  if(c==='back'){i=Math.max(0,i-1);continue}if(c==='flee'){B.acting=null;return 'flee'}cmds.set(h,c);i++}

 if(v==='item'){const id=await choose({title:'Items',x:12,y:190,w:400,rows:6,items:usableItems().map(i=>({label:ITEMS[i].name,right:'×'+run.items[i],value:i,disabled:ITEMS[i].tgt==='deadAlly'&&!run.party.some(x=>x.hp<=0)})),onHover:it=>setInfo(ITEMS[it.value].desc,'left:230px;top:10px;width:500px;text-align:center')});
  if(!id)continue;const t=await pickTarget(ITEMS[id].tgt,h);if(t===null)continue;return {type:'item',id,t}}}}
async function pickTarget(kind,h,pos){if(kind==='self')return h;if(kind==='allEnemies'||kind==='allAllies')return 'all';
 let list;if(kind==='enemy')list=B.enemies.filter(e=>!e.dead);else if(kind==='ally')list=run.party.filter(x=>x.hp>0);else list=run.party.filter(x=>x.hp<=0);if(!list.length)return null;
 let idx=0;if(kind==='ally'){let lo=2;list.forEach((u,i)=>{const r=u.hp/stats(u).hp;if(r<lo){lo=r;idx=i}})}

 if(B)B.cursor=null;return v}
function liveEnemy(t){return t&&!t.dead?t:B.enemies.find(e=>!e.dead)}
function damageEnemy(e,d,col='#fff'){if(e.dead)return;e.hp-=d;e.hitT=now();const [x,y]=ecenter(e);pop(x,y,d,col);

 if(has('glove')&&rnd()<.2){const g=ri(2,6)*(run.floor+1);run.gold+=g;pop(x,y-24,'+'+g+'G','#ffe680')}render();await sleep(330)}

 if(c.type==='atk'){const t=liveEnemy(c.t);if(t){await physHit(h,t,1);if(has('echobell')&&rnd()<.2&&!t.dead){B.msg='Echo!';render();await physHit(h,t,1)}}}

  if(c.id==='firebomb'){run.items.firebomb--;SFX.magic();B.enemies.filter(e=>!e.dead).forEach(e=>fx({k:'burst',x:ecenter(e)[0],y:ecenter(e)[1],color:ELC.fire,dur:450}));await sleep(300);B.enemies.filter(e=>!e.dead).forEach(e=>damageEnemy(e,Math.round((40+35*run.floor)*(e.weak&&e.weak.includes('fire')?2:1)),ELC.fire))}
  else{let t=c.t;if(ITEMS[c.id].tgt==='ally'&&t.hp<=0)t=run.party.find(x=>x.hp>0);applyItem(c.id,t);const [x,y]=heroXY(t);fx({k:'spark',x,y:y-16,color:'#7dffa0',dur:500});SFX.heal()}

 else if(S.type==='heal'||S.type==='healPct'){const ts=S.tgt==='allAllies'?run.party.filter(x=>x.hp>0):S.tgt==='self'?[h]:[tg.hp>0?tg:run.party.find(x=>x.hp>0)];SFX.heal();

 else if(S.type==='revive'){const t=tg;if(t.hp>0){B.msg='No effect.';render()}else{t.hp=Math.round(stats(t).hp*S.pow);const [x,y]=heroXY(t);fx({k:'spark',x,y:y-16,color:'#fff6c0',dur:600});SFX.heal()}render();await sleep(600)}

function drawEnemyBar(e,t){const r=e.hp/e.maxhp;if(e.shown==null)e.shown=r;e.shown=r<e.shown?Math.max(r,e.shown-.012):r;
